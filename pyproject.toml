[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "market-digest"
version = "0.1.0"
description = "Personal Telegram digest and market sentiment service for the Russian stock market"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.30.0,<4",
    "apscheduler>=3.11.3,<4",
    "orjson>=3.11.3,<4",
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.15.0,<3",
    "structlog>=25.4.0,<26",
    "telethon[cryptg]>=1.44.0,<2",
    "tenacity>=9.1.2,<10",
    "tzdata>=2025.2",
]

[project.scripts]
market-digest = "market_digest.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.17.1,<2",
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.1.0,<2",
    "pytest-cov>=6.2.1,<7",
    "ruff>=0.12.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_digest"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["market_digest"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["market_digest"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "telethon.*"]
ignore_missing_imports = true
